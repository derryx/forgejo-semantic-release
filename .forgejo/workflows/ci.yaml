name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: docker
    container:
      image: node:20-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: docker
    container:
      image: node:20-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "actions@forgejo.peuss.de"
          git config --global user.name "Forgejo Actions"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure npm registry
        run: |
          echo "@thomas:registry=https://forgejo.peuss.de/api/packages/thomas/npm/" >> .npmrc
          echo "//forgejo.peuss.de/api/packages/thomas/npm/:_authToken=\${FORGEJO_TOKEN}" >> .npmrc

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          NPM_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: npx semantic-release
