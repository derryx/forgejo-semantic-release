name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: docker
    container:
      image: node:20-alpine
    steps:
      - name: Checkout
        uses: https://forgejo.peuss.de/actions/checkout@v5
        with:
          fetch-depth: 0
      - name: setup node
        uses: https://forgejo.peuss.de/actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: https://forgejo.peuss.de/thomas/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: docker
    container:
      image: node:20-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        uses: https://forgejo.peuss.de/actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}
      - name: setup node
        uses: https://forgejo.peuss.de/actions/setup-node@v6
        with:
          node-version: 24
      - name: Configure git
        run: |
          git config --global user.email "actions@forgejo.peuss.de"
          git config --global user.name "Forgejo Actions"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache npm dependencies
        uses: https://forgejo.peuss.de/thomas/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure npm registry
        run: |
          echo "@thomas:registry=https://forgejo.peuss.de/api/packages/thomas/npm/" >> .npmrc
          echo "//forgejo.peuss.de/api/packages/thomas/npm/:_authToken=\${NPM_TOKEN}" >> .npmrc

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
