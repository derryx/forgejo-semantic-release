name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: node:24-alpine
    steps:
      - name: Checkout
        uses: https://forgejo.peuss.de/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: apk add --no-cache curl jq bash

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          # Determine status emoji
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.lint.outcome }}" = "success" ] && [ "${{ steps.tests.outcome }}" = "success" ]; then
            STATUS="✅ All checks passed"
          else
            STATUS="❌ Some checks failed"
          fi

          # Build comment body
          COMMENT="## CI Status: ${STATUS}

          ### Build
          $( [ "${{ steps.build.outcome }}" = "success" ] && echo "✅ Passed" || echo "❌ Failed" )

          ### Lint
          $( [ "${{ steps.lint.outcome }}" = "success" ] && echo "✅ Passed" || echo "❌ Failed" )

          <details>
          <summary>Lint Output</summary>

          \`\`\`
          $(cat lint-output.txt 2>/dev/null || echo "No output")
          \`\`\`

          </details>

          ### Tests
          $( [ "${{ steps.tests.outcome }}" = "success" ] && echo "✅ Passed" || echo "❌ Failed" )

          <details>
          <summary>Test Output</summary>

          \`\`\`
          $(cat test-output.txt 2>/dev/null || echo "No output")
          \`\`\`

          </details>

          ---
          *Posted by CI at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"

          # Post comment to PR via Forgejo API
          curl -s -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" \
            "https://forgejo.peuss.de/api/v1/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"

      - name: Fail if checks failed
        if: steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: codeberg-medium
    container:
      image: node:24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        uses: https://forgejo.peuss.de/actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}
      - name: Configure git
        run: |
          git config --global user.email "actions@forgejo.peuss.de"
          git config --global user.name "Forgejo Actions"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      #      - name: Cache npm dependencies
      #        uses: https://forgejo.peuss.de/actions/cache@v4
      #        with:
      #          path: ~/.npm
      #          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      #          restore-keys: |
      #            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure npm registry
        run: |
          echo "@thomas:registry=https://forgejo.peuss.de/api/packages/thomas/npm/" >> .npmrc
          echo "//forgejo.peuss.de/api/packages/thomas/npm/:_authToken=\${NPM_TOKEN}" >> .npmrc

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
